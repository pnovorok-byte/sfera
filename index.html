<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#070a0f">
    <title>Сфера Разума</title>

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            --bg-canvas: #070a0f;
            --glass-bg: rgba(18, 20, 26, 0.78);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-border-focus: rgba(255, 255, 255, 0.22);
            --text-primary: #ececf1;
            --text-secondary: #9b9ba6;
            --accent: #66fcf1;
            --accent-dim: rgba(102, 252, 241, 0.12);
            --danger: #ef4444;
            --danger-dim: rgba(239, 68, 68, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-canvas); overflow: hidden; color: var(--text-primary); overscroll-behavior: none; user-select: none; }
        #canvas-container { position: absolute; inset: 0; z-index: 1; }

        #hud { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
        
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
            pointer-events: auto;
        }

        /* Верхняя консоль */
        #top-dock {
            position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
            display: flex; align-items: center; gap: 6px; padding: 6px 12px;
            border-radius: 24px; white-space: nowrap;
        }
        .icon-btn {
            width: 36px; height: 36px; border-radius: 18px; border: 1px solid transparent;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-secondary); cursor: pointer; transition: 0.2s;
            background: transparent;
        }
        .icon-btn svg {
            width: 18px; height: 18px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round;
        }
        .icon-btn:active, .icon-btn.active { 
            background: rgba(255, 255, 255, 0.08); color: var(--text-primary); transform: scale(0.92); 
        }
        #status-pill { padding: 0 8px; font-size: 11.5px; font-weight: 500; letter-spacing: 0.5px; color: var(--text-primary); }

        /* Баннер связи */
        #link-banner {
            position: absolute; top: 74px; left: 50%; transform: translateX(-50%) translateY(-10px);
            padding: 8px 16px; border-radius: 20px; border: 1px solid var(--accent-dim);
            background: rgba(102, 252, 241, 0.05);
            color: var(--accent); font-size: 13px; display: flex; align-items: center; gap: 12px;
            opacity: 0; visibility: hidden; transition: 0.25s; white-space: nowrap;
        }
        #link-banner.active { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
        #btn-cancel-link {
            background: var(--danger-dim); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 4px 10px; border-radius: 10px; font-size: 11.5px; cursor: pointer; font-weight: 500; transition: 0.15s;
        }
        #btn-cancel-link:active { transform: scale(0.95); }

        #empty-hint {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; color: var(--text-secondary); font-size: 14px;
            line-height: 1.6; pointer-events: none; transition: 0.3s; opacity: 0; font-weight: 400;
        }
        #empty-hint.visible { opacity: 1; }

        /* Поиск */
        #search-panel {
            position: absolute; top: 72px; left: 50%; transform: translateX(-50%) translateY(-10px);
            width: 90%; max-width: 360px; padding: 12px; opacity: 0; visibility: hidden; transition: 0.25s;
        }
        #search-panel.active { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
        #search-results { max-height: 200px; overflow-y: auto; margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
        .search-item {
            padding: 10px 12px; border-radius: 12px; background: rgba(255, 255, 255, 0.03);
            font-size: 13.5px; display: flex; align-items: center; gap: 12px; cursor: pointer; border: 1px solid transparent;
        }
        .search-item:active { background: rgba(255, 255, 255, 0.08); border-color: var(--glass-border); }
        .s-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 8px currentColor; }

        /* Кнопка создания (+) */
        #fab {
            position: absolute; bottom: 28px; right: 24px; width: 56px; height: 56px;
            border-radius: 28px; display: flex; align-items: center; justify-content: center;
            color: var(--text-primary); cursor: pointer; border: 1px solid var(--glass-border);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); transition: transform 0.2s, background 0.2s;
            background: rgba(255, 255, 255, 0.05);
        }
        #fab svg { width: 24px; height: 24px; stroke: currentColor; stroke-width: 1.8; fill: none; }
        #fab:active { transform: scale(0.92); background: rgba(255, 255, 255, 0.12); }

        /* ШТОРКА: НАВИГАТОР ПАПОК */
        #atlas-backdrop {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
            z-index: 24; opacity: 0; visibility: hidden; transition: 0.25s;
        }
        #atlas-backdrop.active { opacity: 1; visibility: visible; }

        #atlas-drawer {
            position: fixed; top: 0; left: 0; bottom: 0;
            width: 86%; max-width: 360px; z-index: 25;
            background: rgba(14, 16, 22, 0.96);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border-right: 1px solid var(--glass-border);
            box-shadow: 12px 0 40px rgba(0, 0, 0, 0.7);
            transform: translateX(-102%);
            transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: flex; flex-direction: column;
            padding: 20px 16px;
        }
        #atlas-drawer.active { transform: translateX(0); }

        .atlas-header {
            display: flex; justify-content: space-between; align-items: flex-start;
            margin-bottom: 18px; padding-bottom: 12px;
            border-bottom: 1px solid var(--glass-border);
        }
        .atlas-title-group { display: flex; flex-direction: column; gap: 3px; }
        .atlas-title { font-size: 17px; font-weight: 600; color: var(--text-primary); letter-spacing: -0.2px; }
        .atlas-sub { font-size: 12px; color: var(--text-secondary); font-weight: 400; }

        #atlas-list {
            flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
            padding-right: 2px;
        }
        #atlas-list::-webkit-scrollbar { width: 4px; }
        #atlas-list::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 2px; }

        /* Папки-аккордеоны */
        .folder-wrapper {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            overflow: hidden;
            transition: border-color 0.2s, background 0.2s;
        }
        .folder-wrapper.expanded {
            border-color: var(--glass-border-focus);
            background: rgba(255, 255, 255, 0.035);
        }
        .folder-card {
            padding: 12px 14px;
            display: flex; align-items: center; justify-content: space-between;
            cursor: pointer; transition: 0.15s;
        }
        .folder-card:active { background: rgba(255, 255, 255, 0.05); }
        
        .f-card-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
        .f-toggle-icon {
            width: 18px; height: 18px; display: flex; align-items: center; justify-content: center;
            color: var(--text-secondary); transition: transform 0.2s ease; flex-shrink: 0;
        }
        .f-toggle-icon svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2; fill: none; }
        .folder-wrapper.expanded .f-toggle-icon { transform: rotate(90deg); color: var(--text-primary); }
        .f-toggle-icon.empty { visibility: hidden; width: 6px; }

        .f-card-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 10px currentColor; }
        .f-card-info { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; margin-left: 2px; }
        .f-card-title { font-size: 14px; font-weight: 500; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .f-card-sub { font-size: 11px; color: var(--text-secondary); }

        .f-card-actions { display: flex; align-items: center; gap: 4px; margin-left: 8px; flex-shrink: 0; }
        .f-card-btn {
            width: 32px; height: 32px; border-radius: 10px;
            background: transparent; color: var(--text-secondary);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.15s;
        }
        .f-card-btn svg { width: 15px; height: 15px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .f-card-btn:active { transform: scale(0.92); color: var(--text-primary); background: rgba(255, 255, 255, 0.08); }

        .folder-children {
            padding: 4px 10px 10px 30px;
            display: flex; flex-direction: column; gap: 4px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            background: rgba(0, 0, 0, 0.2);
        }
        .f-child-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 10px; border-radius: 10px;
            background: rgba(255, 255, 255, 0.02);
            transition: 0.15s; cursor: pointer;
        }
        .f-child-item:active { background: rgba(255, 255, 255, 0.08); }
        .f-child-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
        .f-child-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 6px currentColor; }
        .f-child-title { font-size: 13px; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* ПОЛНОЭКРАННЫЙ РЕДАКТОР ЗАМЕТОК */
        #edit-modal {
            position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh;
            background: #090c12;
            z-index: 35; display: flex; flex-direction: column;
            padding: 16px 18px env(safe-area-inset-bottom, 16px);
            opacity: 0; visibility: hidden; pointer-events: none;
            transform: translateY(16px);
            transition: opacity 0.22s, transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #edit-modal.active {
            opacity: 1; visibility: visible; pointer-events: auto;
            transform: translateY(0);
        }

        .edit-nav {
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 12px; margin-bottom: 8px;
            border-bottom: 1px solid var(--glass-border);
            flex-shrink: 0;
        }
        .edit-nav-center {
            font-size: 12.5px; font-weight: 500; color: var(--text-secondary);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55%;
        }
        .btn-nav-save {
            padding: 7px 16px; border-radius: 18px; font-size: 13px; font-weight: 600;
            background: var(--text-primary); color: #000; border: none; cursor: pointer;
            transition: 0.15s;
        }
        .btn-nav-save:active { transform: scale(0.95); background: #d0d0d5; }

        .clean-title-input {
            width: 100%; background: transparent; border: none; outline: none;
            color: var(--text-primary); font-size: 21px; font-weight: 600;
            padding: 8px 0 12px; margin-bottom: 6px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
        }
        .clean-title-input::placeholder { color: rgba(255, 255, 255, 0.24); }

        .editor-body {
            flex: 1; display: flex; flex-direction: column; min-height: 0;
        }
        .clean-textarea {
            width: 100%; height: 100%; flex: 1; background: transparent; border: none; outline: none;
            color: var(--text-primary); font-size: 16px; line-height: 1.6; resize: none;
            user-select: text; overflow-y: auto; padding: 4px 0;
        }
        .clean-textarea::placeholder { color: rgba(255, 255, 255, 0.22); }

        /* Модальные окна (Просмотр и Память) */
        .modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.96);
            width: 92%; max-width: 420px; max-height: 88vh; overflow-y: auto;
            padding: 22px; opacity: 0; visibility: hidden;
            transition: opacity 0.25s, transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: 30; pointer-events: none;
            display: flex; flex-direction: column;
        }
        .modal.active { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); pointer-events: auto; }

        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 14px; gap: 8px; flex-shrink: 0;
        }
        .modal-title { font-size: 17px; font-weight: 600; color: var(--text-primary); letter-spacing: -0.2px; }
        .modal-icon-btn {
            width: 32px; height: 32px; border-radius: 16px; background: rgba(255, 255, 255, 0.05);
            display: flex; align-items: center; justify-content: center; color: var(--text-secondary);
            cursor: pointer; flex-shrink: 0; transition: 0.15s;
        }
        .modal-icon-btn svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .modal-icon-btn:active { background: rgba(255, 255, 255, 0.1); transform: scale(0.92); color: var(--text-primary); }

        #v-title { font-size: 21px; font-weight: 600; line-height: 1.3; margin-bottom: 12px; letter-spacing: -0.2px; }
        #v-text { font-size: 15px; line-height: 1.6; color: var(--text-primary); margin-bottom: 16px; white-space: pre-wrap; user-select: text; max-height: 260px; overflow-y: auto; }
        #v-meta { font-size: 12px; color: var(--text-secondary); display: flex; justify-content: space-between; margin-bottom: 16px; flex-shrink: 0; border-top: 1px solid var(--glass-border); padding-top: 12px; }

        .btn-row { display: flex; gap: 8px; margin-top: 4px; flex-shrink: 0; }
        .btn {
            flex: 1; padding: 11px 8px; border: 1px solid var(--glass-border); color: var(--text-primary);
            background: rgba(255, 255, 255, 0.03); border-radius: 12px; font-weight: 500; cursor: pointer;
            font-size: 13.5px; display: flex; align-items: center; justify-content: center; gap: 6px; transition: 0.15s;
        }
        .btn svg { width: 15px; height: 15px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .btn:active { transform: scale(0.96); background: rgba(255, 255, 255, 0.08); }
        .btn.primary { background: var(--text-primary); color: #000; border-color: transparent; }
        .btn.primary:active { background: #d0d0d5; }
        .btn.danger { color: var(--danger); border-color: rgba(239, 68, 68, 0.3); background: rgba(239, 68, 68, 0.05); }
        .btn.danger:active { background: var(--danger-dim); }

        .file-wrap { position: relative; flex-shrink: 0; }
        .file-wrap input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; z-index: 5; margin: 0; }

        #toast {
            position: fixed; bottom: 105px; left: 50%; transform: translateX(-50%);
            padding: 9px 18px; border-radius: 20px; font-size: 13.5px; font-weight: 500;
            background: var(--text-primary); color: #000;
            opacity: 0; visibility: hidden; transition: 0.25s cubic-bezier(0.2, 0.8, 0.2, 1); z-index: 50; white-space: nowrap;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
        }
        #toast.show { opacity: 1; visibility: visible; bottom: 115px; }

        .mem-bar-bg { width: 100%; height: 6px; background: rgba(255, 255, 255, 0.08); border-radius: 3px; overflow: hidden; margin: 10px 0 16px; }
        #mem-bar-fill { height: 100%; background: var(--text-primary); width: 5%; border-radius: 3px; }
    </style>
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="hud">
        <div id="top-dock" class="glass">
            <div class="icon-btn" id="btn-atlas" title="Папки">
                <svg viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </div>
            <div class="icon-btn" id="btn-center" title="В центр">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>
            </div>
            <div id="status-pill">Сфера: <span id="nc">0</span></div>
            <div class="icon-btn" id="btn-search" title="Поиск">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </div>
            <div class="icon-btn" id="btn-backup" title="Память">
                <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
            </div>
        </div>

        <div id="link-banner" class="glass">
            <span id="link-banner-txt">Коснись звезды для связи</span>
            <span id="btn-cancel-link">Отмена</span>
        </div>

        <div id="empty-hint">Космос чист.<br>Дважды коснись экрана, чтобы зажечь звезду.</div>

        <div id="search-panel" class="glass">
            <input type="text" id="search-input" placeholder="Найти заметку..." style="margin-bottom:4px; width:100%; background:rgba(0,0,0,0.3); border:1px solid var(--glass-border); color:#fff; padding:10px 12px; border-radius:10px; font-size:14px; outline:none;">
            <div id="search-results"></div>
        </div>

        <div id="fab" class="glass" title="Новая заметка">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </div>
        <div id="toast" class="glass">Скопировано</div>
    </div>

    <!-- Боковая шторка: Навигатор папок -->
    <div id="atlas-backdrop"></div>
    <div id="atlas-drawer">
        <div class="atlas-header">
            <div class="atlas-title-group">
                <div class="atlas-title">Папки</div>
                <div class="atlas-sub" id="atlas-stats-count">0 папок • 0 заметок</div>
            </div>
            <div class="modal-icon-btn" id="btn-close-atlas">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </div>
        </div>
        <div id="atlas-list"></div>
    </div>

    <!-- Полноэкранный редактор заметок -->
    <div id="edit-modal">
        <div class="edit-nav">
            <div class="modal-icon-btn" id="btn-cancel" title="Закрыть">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </div>
            <div class="edit-nav-center" id="edit-nav-parent">Новая заметка</div>
            <button class="btn-nav-save" id="btn-save">Вплести</button>
        </div>

        <input type="text" id="m-title" class="clean-title-input" placeholder="Название...">

        <div class="editor-body">
            <textarea id="m-text" class="clean-textarea" placeholder="Твоя мысль..."></textarea>
        </div>
    </div>

    <!-- Окно Просмотра заметки -->
    <div id="view-modal" class="modal glass">
        <div class="modal-header">
            <div class="modal-title" style="font-size:15px; color:var(--text-secondary);">Заметка</div>
            <div class="modal-icon-btn" id="btn-close">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </div>
        </div>

        <div id="v-title">Заголовок</div>
        <div id="v-text"></div>
        <div id="v-meta">
            <span id="v-links-count">Связей: 0</span>
            <span id="v-date"></span>
        </div>

        <div class="btn-row">
            <button class="btn" id="btn-branch">
                <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg> Спутник
            </button>
            <button class="btn" id="btn-bridge">
                <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg> Связь
            </button>
            <button class="btn" id="btn-collapse" style="display:none;">
                <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg> Свернуть
            </button>
        </div>
        <div class="btn-row">
            <button class="btn" id="btn-copy">
                <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            </button>
            <button class="btn" id="btn-edit">
                <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            </button>
            <button class="btn danger" id="btn-del">
                <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
        </div>
    </div>

    <!-- Окно резервного хранилища -->
    <div id="backup-modal" class="modal glass">
        <div class="modal-header">
            <div class="modal-title">Память Сферы</div>
            <div class="modal-icon-btn" id="btn-close-backup">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </div>
        </div>
        <p style="font-size:13px; color:var(--text-secondary);">Занято памяти устройства: <span id="mem-text" style="color:var(--text-primary); font-weight:500;">0 КБ</span></p>
        <div class="mem-bar-bg"><div id="mem-bar-fill"></div></div>
        
        <div class="btn-row">
            <button class="btn" id="btn-export">
                <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                Скачать слепок (.json)
            </button>
        </div>
        <div class="file-wrap" style="margin-top:10px; margin-bottom:0;">
            <div class="btn" style="width:100%; border: 1px solid var(--glass-border);">
                <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                Восстановить из файла
            </div>
            <input type="file" id="import-file" accept=".json,application/json">
        </div>

        <div class="btn-row" style="margin-top:20px;">
            <button class="btn danger" id="btn-wipe-all">
                <svg viewBox="0 0 24 24"><polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"></polygon><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>
                Сброс космоса
            </button>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const haptic = (ms = 14) => { if (navigator.vibrate) try { navigator.vibrate(ms); } catch(e){} };
        const showToast = (msg) => {
            const t = document.getElementById('toast');
            t.innerText = msg; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2600);
        };

        const SPECTRUM_NAMES = {
            'rgba(184,115,51,1)': 'Медь (База)',
            'rgba(102,252,241,1)': 'Кибер-бирюза (Идеи)',
            'rgba(153,102,204,1)': 'Аметист (Смыслы)',
            'rgba(80,200,120,1)': 'Изумруд (Гармония)',
            'rgba(224,17,95,1)': 'Рубин (Импульсы)',
            'rgba(240,248,255,1)': 'Белый эфир (Аксиомы)'
        };

        const rawStorage = localStorage.getItem('sfData_v2');
        let data;
        if (rawStorage === null) {
            data = {
                nodes: [{ id: 1, t: 'Сфера Разума', txt: 'Первая папка. Нажми «Спутник», чтобы развить мысль, коснись дважды экрана для быстрой записи или открой навигатор слева.', c: 'rgba(184,115,51,1)', s: 24, collapsed: false, date: Date.now(), px: 0, py: 0, pz: 0 }],
                links: []
            };
        } else {
            try { data = JSON.parse(rawStorage); } catch(e) { data = { nodes: [], links: [] }; }
            if (!data || !Array.isArray(data.nodes)) data = { nodes: [], links: [] };
            if (!Array.isArray(data.links)) data.links = [];
        }

        data.nodes.forEach((n, idx) => {
            if (isNaN(n.px) || !isFinite(n.px) || Math.abs(n.px) > 800) n.px = idx === 0 ? 0 : (Math.random() - 0.5) * 60;
            if (isNaN(n.py) || !isFinite(n.py) || Math.abs(n.py) > 800) n.py = idx === 0 ? 0 : (Math.random() - 0.5) * 60;
            if (isNaN(n.pz) || !isFinite(n.pz) || Math.abs(n.pz) > 800) n.pz = idx === 0 ? 0 : (Math.random() - 0.5) * 60;
            delete n.imgs; delete n.img;
            if (typeof n.collapsed !== 'boolean') n.collapsed = false;
            if (!n.date) n.date = Date.now();
        });

        function save() {
            try { localStorage.setItem('sfData_v2', JSON.stringify(data)); } 
            catch (e) { showToast('Ошибка сохранения в локальную память'); }
        }

        /* === ФОНОВАЯ КАЛИБРОВКА (Спутники строго наследуют цвет) === */
        async function refineNodeWithAI(nodeId, text, manualTitle, isSatellite = false) {
            const apiKey = (localStorage.getItem('eva_key') || '').trim();
            const apiUrl = (localStorage.getItem('eva_url') || 'https://api.proxyapi.ru/openai/v1').replace(/\/$/, '');
            if (!apiKey || !text) return;

            const promptText = `Проанализируй заметку мыслителя для 3D-графа «Сферы Разума».
Текст: """${text}"""
${manualTitle ? `Авторский заголовок: "${manualTitle}"` : ''}

Определи:
1. "title": Лаконичный, точный и глубокий заголовок (2-4 слова). Если авторский заголовок уже хороший — оставь его.
2. "color": Выбери строго один цвет туманности:
   - "rgba(184,115,51,1)" (Медь: планы, проекты, архитектура, проверенная база)
   - "rgba(102,252,241,1)" (Кибер-бирюза: идеи, гипотезы, код, технологии)
   - "rgba(153,102,204,1)" (Аметист: глубокая философия, буддизм, стихи, смыслы, психология)
   - "rgba(80,200,120,1)" (Изумруд: личные практики, покой, гармония, быт)
   - "rgba(224,17,95,1)" (Рубин: парадоксы, острое, спор, триггеры, сильные эмоции)
   - "rgba(240,248,255,1)" (Белый эфир: чистые афоризмы, аксиомы, точные цитаты)
3. "size": Размер звезды:
   - 8 (Искорка: короткая цитата, мысль в одно предложение)
   - 14 (Звезда: стандартная заметка, стих, размышление)
   - 24 (Сверхгигант: фундаментальная концепция, манифест или крупный хаб темы)

Ответь СТРОГО в формате JSON без разметки:
{"title":"...", "color":"...", "size": 14}`;

            try {
                const res = await fetch(`${apiUrl}/chat/completions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                    body: JSON.stringify({
                        model: 'openai/gpt-4o-mini',
                        messages: [{ role: 'user', content: promptText }],
                        temperature: 0.3
                    })
                });

                if (res.ok) {
                    const json = await res.json();
                    let reply = json.choices?.[0]?.message?.content || '';
                    reply = reply.replace(/```json/gi, '').replace(/```/g, '').trim();
                    const parsed = JSON.parse(reply);

                    const node = data.nodes.find(n => n.id === nodeId);
                    if (node) {
                        if (!manualTitle && parsed.title) node.t = parsed.title;
                        if (parsed.size) node.s = parsed.size;
                        if (!isSatellite && parsed.color && SPECTRUM_NAMES[parsed.color]) {
                            node.c = parsed.color;
                        }
                        save();
                        renderGraph();
                        showToast(`Оформлено: «${node.t}»`);
                    }
                }
            } catch (_) {}
        }

        function getDescendants(rootId, visited = new Set()) {
            visited.add(rootId);
            const children = data.links.filter(l => l.source === rootId && !l.bridge).map(l => l.target);
            let result = [];
            children.forEach(cid => {
                if (!visited.has(cid)) {
                    result.push(cid);
                    result = result.concat(getDescendants(cid, visited));
                }
            });
            return result;
        }

        function computeCollapseState() {
            const hiddenIds = new Set();
            const collapsedCounts = {};
            data.nodes.forEach(n => {
                if (n.collapsed) {
                    const desc = getDescendants(n.id, new Set());
                    collapsedCounts[n.id] = desc.length;
                    desc.forEach(id => hiddenIds.add(id));
                }
            });
            return { hiddenIds, collapsedCounts };
        }

        function ensureNodeVisible(targetId) {
            let changed = false;
            data.nodes.forEach(n => {
                if (n.collapsed) {
                    const desc = getDescendants(n.id, new Set());
                    if (desc.includes(targetId)) { n.collapsed = false; changed = true; }
                }
            });
            if (changed) { save(); renderGraph(); }
        }

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x070a0f, 0.0016);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2500);
        camera.position.set(0, 0, 195);

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; controls.dampingFactor = 0.06;
        controls.minDistance = 15; controls.maxDistance = 1000;

        const camFlight = { active: false, target: new THREE.Vector3(), camPos: new THREE.Vector3() };
        function flyTo(pos, dist = 85) {
            camFlight.target.copy(pos);
            const dir = new THREE.Vector3().subVectors(camera.position, controls.target).normalize();
            if (dir.lengthSq() < 0.01) dir.set(0, 0, 1);
            camFlight.camPos.copy(pos).addScaledVector(dir, dist);
            camFlight.active = true;
        }
        renderer.domElement.addEventListener('pointerdown', () => { camFlight.active = false; });

        const texCache = {};
        function getGlowTex(color) {
            if (texCache[color]) return texCache[color];
            const cvs = document.createElement('canvas'); cvs.width = 128; cvs.height = 128;
            const ctx = cvs.getContext('2d');
            const grd = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
            grd.addColorStop(0, '#ffffff');
            grd.addColorStop(0.16, color);
            grd.addColorStop(0.45, color.replace('1)', '0.35)'));
            grd.addColorStop(1, 'transparent');
            ctx.fillStyle = grd; ctx.fillRect(0, 0, 128, 128);
            return texCache[color] = new THREE.CanvasTexture(cvs);
        }

        const nebCache = {};
        function getNebulaTex(color) {
            if (nebCache[color]) return nebCache[color];
            const cvs = document.createElement('canvas'); cvs.width = 256; cvs.height = 256;
            const ctx = cvs.getContext('2d');
            const grd = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
            grd.addColorStop(0, color.replace('1)', '0.18)'));
            grd.addColorStop(0.45, color.replace('1)', '0.07)'));
            grd.addColorStop(1, 'transparent');
            ctx.fillStyle = grd; ctx.fillRect(0, 0, 256, 256);
            return nebCache[color] = new THREE.CanvasTexture(cvs);
        }

        function getTextTex(txt, color) {
            const cvs = document.createElement('canvas'); const ctx = cvs.getContext('2d');
            const font = '500 32px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
            ctx.font = font;
            const cleanTxt = txt.length > 28 ? txt.slice(0, 27) + '…' : txt;
            const w = Math.max(Math.min(ctx.measureText(cleanTxt).width + 38, 560), 64);
            cvs.width = w; cvs.height = 54;
            ctx.font = font; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.shadowColor = color; ctx.shadowBlur = 12;
            ctx.fillStyle = '#ececf1';
            ctx.fillText(cleanTxt, w / 2, 27);
            return new THREE.CanvasTexture(cvs);
        }

        /* === ЗВЁЗДНЫЕ СЛОИ === */
        const starCanvas = document.createElement('canvas');
        starCanvas.width = 32; starCanvas.height = 32;
        const starCtx = starCanvas.getContext('2d');
        const starGradient = starCtx.createRadialGradient(16, 16, 0, 16, 16, 16);
        starGradient.addColorStop(0, '#ffffff');
        starGradient.addColorStop(0.2, 'rgba(255, 255, 255, 1)');
        starGradient.addColorStop(0.5, 'rgba(214, 235, 255, 0.75)');
        starGradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
        starCtx.fillStyle = starGradient;
        starCtx.fillRect(0, 0, 32, 32);
        const starTexture = new THREE.CanvasTexture(starCanvas);

        function createStarLayer(count, size, baseOpacity) {
            const pts = new Float32Array(count * 3);
            for (let i = 0; i < count * 3; i += 3) {
                pts[i] = THREE.MathUtils.randFloatSpread(1600);
                pts[i + 1] = THREE.MathUtils.randFloatSpread(1600);
                pts[i + 2] = THREE.MathUtils.randFloatSpread(1600);
            }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(pts, 3));
            const mat = new THREE.PointsMaterial({
                color: 0xffffff, size: size, map: starTexture, transparent: true, opacity: baseOpacity, fog: false, blending: THREE.AdditiveBlending, depthWrite: false
            });
            const field = new THREE.Points(geo, mat);
            scene.add(field);
            return field;
        }

        const starsA = createStarLayer(1200, 3.4, 0.9);
        const starsB = createStarLayer(1100, 2.6, 0.75);
        const starsC = createStarLayer(900, 4.2, 0.85);

        /* === МЕТЕОРЫ === */
        const meteorGeo = new THREE.BufferGeometry();
        const meteorPts = new Float32Array(6);
        meteorGeo.setAttribute('position', new THREE.BufferAttribute(meteorPts, 3));
        const meteorMat = new THREE.LineBasicMaterial({ color: 0x66fcf1, transparent: true, opacity: 0, fog: false, blending: THREE.AdditiveBlending, depthWrite: false });
        const meteorLine = new THREE.Line(meteorGeo, meteorMat);
        scene.add(meteorLine);

        const meteorHeadMat = new THREE.SpriteMaterial({ map: getGlowTex('rgba(102,252,241,1)'), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0 });
        const meteorHeadSprite = new THREE.Sprite(meteorHeadMat);
        meteorHeadSprite.scale.set(4, 4, 1);
        scene.add(meteorHeadSprite);

        const meteor = { active: false, head: new THREE.Vector3(), tail: new THREE.Vector3(), dir: new THREE.Vector3(), speed: 5.5, tailLen: 70, progress: 0, nextSpawnTime: Date.now() + 1500 };

        function spawnMeteor() {
            const camDir = new THREE.Vector3().subVectors(controls.target, camera.position).normalize();
            const camRight = new THREE.Vector3().crossVectors(camDir, camera.up).normalize();
            const camUp = new THREE.Vector3().crossVectors(camRight, camDir).normalize();
            const distInFront = 280 + Math.random() * 80;
            const viewCenter = camera.position.clone().addScaledVector(camDir, distInFront);
            const side = Math.random() > 0.5 ? 1 : -1;

            meteor.head.copy(viewCenter).addScaledVector(camRight, side * (70 + Math.random() * 30)).addScaledVector(camUp, 60 + Math.random() * 25);
            meteor.dir.copy(camRight).multiplyScalar(-side * 0.85).addScaledVector(camUp, -0.55).addScaledVector(camDir, (Math.random() - 0.5) * 0.2).normalize();
            meteor.tail.copy(meteor.head);
            meteor.progress = 0; meteor.active = true;
        }

        function updateMeteor() {
            const now = Date.now();
            if (!meteor.active) { if (now > meteor.nextSpawnTime) spawnMeteor(); return; }
            meteor.progress += 0.012;
            meteor.head.addScaledVector(meteor.dir, meteor.speed);
            meteor.tail.copy(meteor.head).addScaledVector(meteor.dir, -meteor.tailLen);

            const pos = meteorGeo.attributes.position.array;
            pos[0] = meteor.head.x; pos[1] = meteor.head.y; pos[2] = meteor.head.z;
            pos[3] = meteor.tail.x; pos[4] = meteor.tail.y; pos[5] = meteor.tail.z;
            meteorGeo.attributes.position.needsUpdate = true;
            meteorHeadSprite.position.copy(meteor.head);

            let currentOp = meteor.progress < 0.2 ? (meteor.progress / 0.2) : (meteor.progress > 0.6 ? Math.max(0, 1 - (meteor.progress - 0.6) / 0.4) : 1.0);
            meteorMat.opacity = currentOp * 0.9;
            meteorHeadMat.opacity = currentOp * 0.95;

            if (meteor.progress >= 1.0) {
                meteor.active = false;
                meteorMat.opacity = 0; meteorHeadMat.opacity = 0;
                meteor.nextSpawnTime = now + (25000 + Math.random() * 5000);
            }
        }

        let meshes = [], pickables = [], objs = [], links = [], labels = [], rings = [], pulses = [], nebulae = [];
        const nebGrp = new THREE.Group(); scene.add(nebGrp);
        const lGrp = new THREE.Group(); scene.add(lGrp);
        const ringGrp = new THREE.Group(); scene.add(ringGrp);
        const pulseGrp = new THREE.Group(); scene.add(pulseGrp);

        const baseRingGeo = new THREE.BufferGeometry();
        const ringPts = [];
        for (let i = 0; i <= 48; i++) {
            const a = (i / 48) * Math.PI * 2;
            ringPts.push(Math.cos(a), Math.sin(a), 0);
        }
        baseRingGeo.setAttribute('position', new THREE.Float32BufferAttribute(ringPts, 3));

        let physicsAlpha = 1.0;
        const wakePhysics = () => { physicsAlpha = 1.0; };
        let tracedSet = null;

        function renderGraph() {
            meshes.forEach(m => scene.remove(m));
            labels.forEach(l => scene.remove(l.s));
            nebGrp.clear(); lGrp.clear(); ringGrp.clear(); pulseGrp.clear();
            meshes = []; pickables = []; objs = []; links = []; labels = []; rings = []; pulses = []; nebulae = [];

            const { hiddenIds, collapsedCounts } = computeCollapseState();
            const colorGroups = {};

            data.nodes.forEach(n => {
                if (hiddenIds.has(n.id)) return;
                const sMat = new THREE.SpriteMaterial({ map: getGlowTex(n.c), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true });
                const s = new THREE.Sprite(sMat);
                const hiddenCnt = collapsedCounts[n.id] || 0;
                const scaleBoost = hiddenCnt > 0 ? 1.25 : 1.0;
                s.scale.set(n.s * 2.2 * scaleBoost, n.s * 2.2 * scaleBoost, 1);
                s.position.set(n.px, n.py, n.pz);
                s.userData = { id: n.id };
                scene.add(s);
                meshes.push(s);
                pickables.push(s);

                if (hiddenCnt > 0) {
                    const cMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.75, blending: THREE.AdditiveBlending });
                    const cRing = new THREE.LineLoop(baseRingGeo, cMat);
                    const rad = n.s * 1.38;
                    cRing.scale.set(rad, rad, rad);
                    ringGrp.add(cRing);
                    rings.push({ mesh: cRing, targetPos: s.position, speedX: 0.02, speedY: -0.02, nodeId: n.id });
                }

                const displayTitle = hiddenCnt > 0 ? `${n.t} [${hiddenCnt}]` : n.t;
                const tTex = getTextTex(displayTitle, n.c);
                const labelMat = new THREE.SpriteMaterial({ map: tTex, transparent: true, depthWrite: false });
                const l = new THREE.Sprite(labelMat);
                l.scale.set(tTex.image.width / 4.2, tTex.image.height / 4.2, 1);
                l.userData = { id: n.id };
                scene.add(l);

                const obj = { pos: s.position, vel: new THREE.Vector3(), n, sprite: s, labelSprite: l, targetOp: 1.0 };
                objs.push(obj);
                labels.push({ s: l, p: s.position, off: n.s * scaleBoost, id: n.id, obj });
                pickables.push(l);

                if (!colorGroups[n.c]) colorGroups[n.c] = [];
                colorGroups[n.c].push(obj);
            });

            Object.keys(colorGroups).forEach(col => {
                const group = colorGroups[col];
                if (group.length > 0) {
                    const nMat = new THREE.SpriteMaterial({ map: getNebulaTex(col), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.85 });
                    const nSprite = new THREE.Sprite(nMat);
                    const baseSize = group.length === 1 ? 160 : 250 + Math.min(group.length * 25, 180);
                    nSprite.scale.set(baseSize, baseSize, 1);
                    nebGrp.add(nSprite);
                    nebulae.push({ sprite: nSprite, group, color: col });
                }
            });

            const pulseTex = getGlowTex('rgba(102,252,241,1)');
            const bridgePulseTex = getGlowTex('rgba(243,168,103,1)');

            data.links.forEach((l, idx) => {
                if (hiddenIds.has(l.source) || hiddenIds.has(l.target)) return;
                const src = objs.find(o => o.n.id === l.source);
                const tgt = objs.find(o => o.n.id === l.target);
                if (src && tgt) {
                    const lineGeo = new THREE.BufferGeometry().setFromPoints([src.pos, tgt.pos]);
                    const individualMat = new THREE.LineBasicMaterial({
                        color: l.bridge ? 0xf3a867 : 0x66fcf1, transparent: true, opacity: l.bridge ? 0.42 : 0.28, blending: THREE.AdditiveBlending
                    });
                    const line = new THREE.Line(lineGeo, individualMat);
                    lGrp.add(line);

                    const pSprite = new THREE.Sprite(new THREE.SpriteMaterial({
                        map: l.bridge ? bridgePulseTex : pulseTex, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.85
                    }));
                    pSprite.scale.set(4.5, 4.5, 1);
                    pulseGrp.add(pSprite);

                    links.push({ src, tgt, line, bridge: !!l.bridge, pulse: pSprite });
                    pulses.push({ sprite: pSprite, src, tgt, phase: (idx * 0.27) % 1 });
                }
            });

            document.getElementById('nc').innerText = data.nodes.length;
            document.getElementById('empty-hint').classList.toggle('visible', data.nodes.length === 0);
            applyVisualFilters();
            wakePhysics();
            if (atlasDrawer.classList.contains('active')) renderAtlas();
        }

        function buildTraceSet(startId) {
            const set = new Set([startId]);
            const upQueue = [startId];
            while (upQueue.length) {
                const curr = upQueue.shift();
                data.links.forEach(l => {
                    if (l.target === curr && !set.has(l.source)) { set.add(l.source); upQueue.push(l.source); }
                });
            }
            const downQueue = [startId];
            while (downQueue.length) {
                const curr = downQueue.shift();
                data.links.forEach(l => {
                    if (l.source === curr && !set.has(l.target)) { set.add(l.target); downQueue.push(l.target); }
                });
            }
            return set;
        }

        function applyVisualFilters() {
            objs.forEach(o => {
                let op = tracedSet ? (tracedSet.has(o.n.id) ? 1.0 : 0.12) : 1.0;
                o.targetOp = op; o.sprite.material.opacity = op;
            });
            links.forEach(l => {
                if (tracedSet) {
                    const inTrace = tracedSet.has(l.src.n.id) && tracedSet.has(l.tgt.n.id);
                    l.line.material.opacity = inTrace ? 0.78 : 0.04;
                    l.pulse.material.opacity = inTrace ? 1.0 : 0.05;
                } else {
                    l.line.material.opacity = l.bridge ? 0.42 : 0.28;
                    l.pulse.material.opacity = 0.85;
                }
            });
            nebulae.forEach(neb => { neb.sprite.material.opacity = tracedSet ? 0.25 : 0.85; });
            rings.forEach(r => { r.mesh.material.opacity = tracedSet ? (tracedSet.has(r.nodeId) ? 0.75 : 0.08) : 0.55; });
        }

        function physics() {
            if (physicsAlpha < 0.01 || objs.length === 0) return;
            physicsAlpha *= 0.994;

            for (let i = 0; i < objs.length; i++) {
                for (let j = i + 1; j < objs.length; j++) {
                    const diff = new THREE.Vector3().subVectors(objs[i].pos, objs[j].pos);
                    let dist = diff.length();
                    if (dist < 1) { diff.set(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize(); dist = 1; }
                    if (dist < 105) {
                        const f = diff.clone().normalize().multiplyScalar((135 / (dist * dist)) * physicsAlpha);
                        objs[i].vel.add(f); objs[j].vel.sub(f);
                    }
                    if (objs[i].n.c === objs[j].n.c && dist > 65 && dist < 240) {
                        const fColor = diff.clone().normalize().multiplyScalar(-0.008 * physicsAlpha);
                        objs[i].vel.add(fColor); objs[j].vel.sub(fColor);
                    }
                }
                const dCenter = objs[i].pos.length();
                if (objs.length === 1) objs[i].pos.multiplyScalar(0.9);
                else if (dCenter > 110) objs[i].vel.sub(objs[i].pos.clone().normalize().multiplyScalar((dCenter - 110) * 0.0006 * physicsAlpha));
            }

            links.forEach(l => {
                const diff = new THREE.Vector3().subVectors(l.tgt.pos, l.src.pos);
                const dist = diff.length();
                if (dist > 0.1) {
                    const ideal = l.bridge ? 85 : (34 + (l.src.n.s + l.tgt.n.s) * 0.65);
                    const strength = l.bridge ? 0.012 : 0.028;
                    const f = diff.normalize().multiplyScalar((dist - ideal) * strength * physicsAlpha);
                    l.src.vel.add(f); l.tgt.vel.sub(f);
                }
            });

            objs.forEach(o => {
                o.vel.clampLength(0, 2.5);
                o.vel.multiplyScalar(0.84);
                o.pos.add(o.vel);
                o.n.px = o.pos.x; o.n.py = o.pos.y; o.n.pz = o.pos.z;
            });
        }

        /* === УПРАВЛЕНИЕ ЗАМЕТКАМИ === */
        let curId = null;
        let parentIdForNew = null;
        let linkingFromId = null;

        const editModal = document.getElementById('edit-modal');
        const viewModal = document.getElementById('view-modal');
        const backupModal = document.getElementById('backup-modal');
        const linkBanner = document.getElementById('link-banner');

        function closeViewModal() {
            viewModal.classList.remove('active');
            tracedSet = null;
            applyVisualFilters();
        }

        function closeEditModal() { 
            editModal.classList.remove('active');
            document.activeElement?.blur();
        }

        function openCreateModal(parentId = null) {
            haptic(15);
            curId = null; parentIdForNew = parentId;
            const parentNode = parentId ? data.nodes.find(n => n.id === parentId) : null;
            const navCenter = document.getElementById('edit-nav-parent');
            
            if (parentNode) {
                navCenter.innerText = `В папку «${parentNode.t}»`;
                navCenter.style.color = 'var(--accent)';
            } else {
                navCenter.innerText = 'Новая папка / мысль';
                navCenter.style.color = 'var(--text-secondary)';
            }
            
            document.getElementById('m-title').value = '';
            document.getElementById('m-text').value = '';
            editModal.classList.add('active');
            setTimeout(() => document.getElementById('m-text').focus(), 180);
        }

        function openEditModalById(id) {
            const n = data.nodes.find(x => x.id === id);
            if (!n) return;
            haptic(12);
            closeViewModal();
            curId = id;
            document.getElementById('edit-nav-parent').innerText = 'Редактирование';
            document.getElementById('edit-nav-parent').style.color = 'var(--text-secondary)';
            document.getElementById('m-title').value = n.t;
            document.getElementById('m-text').value = n.txt || '';
            editModal.classList.add('active');
            setTimeout(() => document.getElementById('m-text').focus(), 180);
        }

        document.getElementById('fab').onclick = () => { closeViewModal(); openCreateModal(null); };

        document.getElementById('btn-branch').onclick = () => {
            const pid = curId;
            const pNode = data.nodes.find(n => n.id === pid);
            if (pNode && pNode.collapsed) pNode.collapsed = false;
            closeViewModal(); openCreateModal(pid);
        };

        document.getElementById('btn-bridge').onclick = () => {
            const n = data.nodes.find(x => x.id === curId);
            if (!n) return;
            haptic(15); linkingFromId = curId; closeViewModal();
            document.getElementById('link-banner-txt').innerText = `Коснись звезды для связи с «${n.t.slice(0, 14)}»`;
            linkBanner.classList.add('active');
        };

        document.getElementById('btn-cancel-link').onclick = () => { haptic(10); linkingFromId = null; linkBanner.classList.remove('active'); };

        document.getElementById('btn-collapse').onclick = () => {
            const n = data.nodes.find(x => x.id === curId);
            if (!n) return;
            haptic(25); n.collapsed = !n.collapsed; save(); closeViewModal(); renderGraph();
            showToast(n.collapsed ? 'Папка свёрнута' : 'Папка развёрнута');
        };

        document.getElementById('btn-save').onclick = () => {
            haptic(20);
            const txt = document.getElementById('m-text').value.trim();
            let t = document.getElementById('m-title').value.trim();

            if (!t && txt) {
                t = txt.split('\n')[0].slice(0, 26);
                if (txt.length > 26) t += '…';
            } else if (!t) {
                t = 'Мысль';
            }

            const isEdit = !!curId;
            let activeId = curId;

            if (isEdit) {
                const n = data.nodes.find(x => x.id === curId);
                if (n) { n.t = t; n.txt = txt; }
            } else {
                activeId = Date.now();
                const parent = parentIdForNew ? data.nodes.find(n => n.id === parentIdForNew) : null;
                const defColor = parent ? parent.c : 'rgba(184,115,51,1)';
                let px = 0, py = 0, pz = 0;

                if (parent) {
                    parent.collapsed = false;
                    const angle = Math.random() * Math.PI * 2;
                    const spread = 30;
                    px = parent.px + Math.cos(angle) * spread;
                    py = parent.py + Math.sin(angle) * spread;
                    pz = parent.pz + (Math.random() - 0.5) * spread;
                } else if (data.nodes.length > 0) {
                    const angle = Math.random() * Math.PI * 2;
                    const dist = 75 + Math.random() * 45;
                    px = Math.cos(angle) * dist;
                    py = Math.sin(angle) * dist;
                    pz = (Math.random() - 0.5) * 60;
                }

                const newNode = {
                    id: activeId, t, txt, s: 13, c: defColor, collapsed: false, date: activeId, px, py, pz
                };
                data.nodes.push(newNode);
                if (parent) data.links.push({ source: parent.id, target: activeId });

                if (!atlasDrawer.classList.contains('active')) {
                    setTimeout(() => flyTo(new THREE.Vector3(px, py, pz), 95), 80);
                }
            }

            save(); renderGraph(); closeEditModal();

            if (txt) {
                const isSatellite = isEdit ? data.links.some(l => l.target === activeId && !l.bridge) : !!parentIdForNew;
                refineNodeWithAI(activeId, txt, document.getElementById('m-title').value.trim(), isSatellite);
            }
        };

        function openViewModal(id) {
            ensureNodeVisible(id);
            const n = data.nodes.find(x => x.id === id);
            if (!n) return;
            haptic(12); curId = id;
            tracedSet = buildTraceSet(id); applyVisualFilters();

            document.getElementById('v-title').innerText = n.t;
            document.getElementById('v-text').innerText = n.txt || 'Без текстового описания...';
            document.getElementById('v-date').innerText = new Date(n.date || Date.now()).toLocaleDateString('ru-RU');
            const lCount = data.links.filter(l => l.source === id || l.target === id).length;
            document.getElementById('v-links-count').innerText = `Связей: ${lCount}`;

            const desc = getDescendants(id, new Set());
            const btnCollapse = document.getElementById('btn-collapse');
            if (desc.length > 0) {
                btnCollapse.style.display = 'flex';
                btnCollapse.innerHTML = n.collapsed 
                    ? `<svg viewBox="0 0 24 24"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg> Развернуть` 
                    : `<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg> Свернуть`;
            } else { btnCollapse.style.display = 'none'; }

            const obj = objs.find(o => o.n.id === id);
            if (obj) flyTo(obj.pos, 82);
            viewModal.classList.add('active');
        }

        document.getElementById('btn-edit').onclick = () => openEditModalById(curId);

        /* === БУФЕР И КОПИРОВАНИЕ === */
        document.getElementById('btn-copy').onclick = () => {
            const n = data.nodes.find(x => x.id === curId);
            if (!n) return;
            haptic(15);
            const full = `${n.t}\n\n${n.txt || ''}`.trim();
            navigator.clipboard.writeText(full).then(() => showToast('Заметка скопирована'));
        };

        document.getElementById('btn-del').onclick = () => {
            if (!confirm('Рассеять эту звезду?')) return;
            haptic(30);

            const incomingParents = data.links.filter(l => l.target === curId).map(l => l.source);
            const outgoingChildren = data.links.filter(l => l.source === curId).map(l => l.target);
            data.links = data.links.filter(l => l.source !== curId && l.target !== curId);

            if (incomingParents.length > 0 && outgoingChildren.length > 0) {
                const mainParent = incomingParents[0];
                outgoingChildren.forEach(childId => {
                    if (childId !== mainParent && !data.links.some(l => (l.source === mainParent && l.target === childId) || (l.source === childId && l.target === mainParent))) {
                        data.links.push({ source: mainParent, target: childId });
                    }
                });
            } else if (incomingParents.length === 0 && outgoingChildren.length > 1) {
                const newHub = outgoingChildren[0];
                for (let i = 1; i < outgoingChildren.length; i++) {
                    const childId = outgoingChildren[i];
                    if (!data.links.some(l => (l.source === newHub && l.target === childId) || (l.source === childId && l.target === newHub))) {
                        data.links.push({ source: newHub, target: childId });
                    }
                }
            }
            data.nodes = data.nodes.filter(n => n.id !== curId);
            closeViewModal(); save(); renderGraph();
        };

        document.getElementById('btn-cancel').onclick = () => closeEditModal();
        document.getElementById('btn-close').onclick = () => closeViewModal();
        document.getElementById('btn-center').onclick = () => { haptic(12); closeViewModal(); flyTo(new THREE.Vector3(0, 0, 0), 195); };

        /* === ШТОРКА: НАВИГАТОР ПАПОК === */
        const atlasDrawer = document.getElementById('atlas-drawer');
        const atlasBackdrop = document.getElementById('atlas-backdrop');
        const atlasList = document.getElementById('atlas-list');
        const expandedFolders = new Set();

        function openAtlas() {
            haptic(14);
            renderAtlas();
            atlasDrawer.classList.add('active');
            atlasBackdrop.classList.add('active');
        }

        function closeAtlas() {
            atlasDrawer.classList.remove('active');
            atlasBackdrop.classList.remove('active');
        }

        document.getElementById('btn-atlas').onclick = openAtlas;
        document.getElementById('btn-close-atlas').onclick = closeAtlas;
        atlasBackdrop.onclick = closeAtlas;

        function renderAtlas() {
            atlasList.innerHTML = '';
            const incomingTargets = new Set(data.links.filter(l => !l.bridge).map(l => l.target));
            const rootNodes = data.nodes.filter(n => !incomingTargets.has(n.id));

            document.getElementById('atlas-stats-count').innerText = `${rootNodes.length} папок • ${data.nodes.length} заметок`;

            if (data.nodes.length === 0) {
                atlasList.innerHTML = `<div style="text-align:center; color:var(--text-secondary); font-size:13px; margin-top:40px;">Космос чист.<br>Дважды коснись экрана, чтобы зажечь звезду.</div>`;
                return;
            }

            rootNodes.forEach(node => {
                const descIds = getDescendants(node.id, new Set());
                const children = descIds.map(id => data.nodes.find(n => n.id === id)).filter(Boolean);
                const isExpanded = expandedFolders.has(node.id);

                const wrap = document.createElement('div');
                wrap.className = 'folder-wrapper' + (isExpanded ? ' expanded' : '');

                wrap.innerHTML = `
                    <div class="folder-card">
                        <div class="f-card-left">
                            <div class="f-toggle-icon ${children.length ? '' : 'empty'}">
                                <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
                            </div>
                            <div class="f-card-dot" style="background:${node.c}; color:${node.c};"></div>
                            <div class="f-card-info">
                                <div class="f-card-title">${node.t}</div>
                                <div class="f-card-sub">${children.length > 0 ? `${children.length + 1} заметок` : '1 заметка'}</div>
                            </div>
                        </div>
                        <div class="f-card-actions">
                            <div class="f-card-btn edit" title="Редактировать">
                                <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                            </div>
                        </div>
                    </div>
                `;

                wrap.querySelector('.f-card-left').onclick = (e) => {
                    if (children.length > 0 && (e.target.closest('.f-toggle-icon') || !e.target.closest('.f-card-info'))) {
                        haptic(10);
                        if (expandedFolders.has(node.id)) expandedFolders.delete(node.id);
                        else expandedFolders.add(node.id);
                        renderAtlas();
                        return;
                    }
                    haptic(14);
                    closeAtlas();
                    const obj = objs.find(o => o.n.id === node.id);
                    if (obj) flyTo(obj.pos, 90);
                };

                wrap.querySelector('.f-card-btn.edit').onclick = (e) => {
                    e.stopPropagation();
                    closeAtlas();
                    openEditModalById(node.id);
                };

                if (isExpanded && children.length > 0) {
                    const childBox = document.createElement('div');
                    childBox.className = 'folder-children';

                    children.forEach(ch => {
                        const row = document.createElement('div');
                        row.className = 'f-child-item';
                        row.innerHTML = `
                            <div class="f-child-left">
                                <div class="f-child-dot" style="background:${ch.c}; color:${ch.c};"></div>
                                <div class="f-child-title">${ch.t}</div>
                            </div>
                            <div class="f-card-btn edit" style="width:28px;height:28px;" title="Изменить">
                                <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                            </div>
                        `;

                        row.querySelector('.f-child-left').onclick = () => {
                            haptic(12);
                            closeAtlas();
                            const obj = objs.find(o => o.n.id === ch.id);
                            if (obj) flyTo(obj.pos, 85);
                        };

                        row.querySelector('.f-card-btn.edit').onclick = (e) => {
                            e.stopPropagation();
                            closeAtlas();
                            openEditModalById(ch.id);
                        };

                        childBox.appendChild(row);
                    });

                    wrap.appendChild(childBox);
                }

                atlasList.appendChild(wrap);
            });
        }

        /* === ПОИСК И ХРАНИЛИЩЕ === */
        const searchPanel = document.getElementById('search-panel');
        const searchInput = document.getElementById('search-input');
        const searchRes = document.getElementById('search-results');

        document.getElementById('btn-search').onclick = () => {
            haptic(10); searchPanel.classList.toggle('active'); document.getElementById('btn-search').classList.toggle('active');
            if (searchPanel.classList.contains('active')) { searchInput.value = ''; updateSearch(''); searchInput.focus(); }
            else { applyVisualFilters(); }
        };

        function updateSearch(q) {
            searchRes.innerHTML = '';
            const query = q.trim().toLowerCase();
            if (!query) { applyVisualFilters(); return; }
            objs.forEach(o => {
                const match = o.n.t.toLowerCase().includes(query) || (o.n.txt && o.n.txt.toLowerCase().includes(query));
                o.sprite.material.opacity = match ? 1.0 : 0.12; o.targetOp = match ? 1.0 : 0.12;
                if (match) {
                    const div = document.createElement('div'); div.className = 'search-item';
                    div.innerHTML = `<div class="s-dot" style="background:${o.n.c}; color:${o.n.c};"></div><span>${o.n.t}</span>`;
                    div.onclick = () => { searchPanel.classList.remove('active'); document.getElementById('btn-search').classList.remove('active'); openViewModal(o.n.id); };
                    searchRes.appendChild(div);
                }
            });
        }
        searchInput.oninput = (e) => updateSearch(e.target.value);

        document.getElementById('btn-backup').onclick = () => {
            haptic(12);
            const raw = localStorage.getItem('sfData_v2') || '';
            const kb = Math.round((raw.length * 2) / 1024);
            document.getElementById('mem-text').innerText = `${kb} КБ из ~5000 КБ`;
            document.getElementById('mem-bar-fill').style.width = `${Math.min((kb / 5000) * 100, 100)}%`;
            backupModal.classList.add('active');
        };
        document.getElementById('btn-close-backup').onclick = () => backupModal.classList.remove('active');

        document.getElementById('btn-export').onclick = () => {
            haptic(15);
            const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = `sfera_razuma_${new Date().toISOString().slice(0,10)}.json`;
            a.click(); URL.revokeObjectURL(url); showToast('Слепок сохранён');
        };

        document.getElementById('import-file').onchange = (e) => {
            const file = e.target.files[0]; if (!file) return;
            const r = new FileReader();
            r.onload = (ev) => {
                try {
                    const parsed = JSON.parse(ev.target.result);
                    if (parsed && Array.isArray(parsed.nodes)) {
                        data = parsed; save(); renderGraph(); backupModal.classList.remove('active'); showToast('Вселенная восстановлена!');
                    }
                } catch (err) { showToast('Ошибка формата файла'); }
            };
            r.readAsText(file);
        };

        document.getElementById('btn-wipe-all').onclick = () => {
            if (!confirm('Точно очистить весь космос до нуля?')) return;
            haptic(40); data = { nodes: [], links: [] }; tracedSet = null;
            save(); renderGraph(); backupModal.classList.remove('active'); showToast('Космос обнулён');
        };

        /* === ТАПЫ ПО 3D И ДВОЙНОЙ ТАП В ПУСТОТУ === */
        const rc = new THREE.Raycaster();
        let tS = { x: 0, y: 0 };
        let lastTapTime = 0;

        window.addEventListener('touchstart', e => {
            if (e.touches.length === 1) tS = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }, { passive: true });

        window.addEventListener('touchend', e => {
            if (e.target.closest('#hud') || e.target.closest('.modal') || e.target.closest('#edit-modal') || e.target.closest('#atlas-drawer') || e.target.closest('#atlas-backdrop')) return;
            if (!e.changedTouches.length) return;
            if (Math.hypot(e.changedTouches[0].clientX - tS.x, e.changedTouches[0].clientY - tS.y) > 14) return;

            const now = Date.now();
            const isDoubleTap = (now - lastTapTime < 280);
            lastTapTime = now;

            const m = new THREE.Vector2((e.changedTouches[0].clientX / window.innerWidth) * 2 - 1, -(e.changedTouches[0].clientY / window.innerHeight) * 2 + 1);
            rc.setFromCamera(m, camera);
            const hits = rc.intersectObjects(pickables);

            if (hits.length) {
                const targetId = hits[0].object.userData.id;
                if (linkingFromId !== null) {
                    if (targetId === linkingFromId) { showToast('Выбери другую звезду'); return; }
                    const existingIdx = data.links.findIndex(l => (l.source === linkingFromId && l.target === targetId) || (l.source === targetId && l.target === linkingFromId));
                    if (existingIdx !== -1) { data.links.splice(existingIdx, 1); haptic(25); showToast('Синапс разорван'); }
                    else { data.links.push({ source: linkingFromId, target: targetId, bridge: true }); haptic(25); showToast('Мост создан!'); }
                    linkingFromId = null; linkBanner.classList.remove('active'); save(); renderGraph(); return;
                }
                openViewModal(targetId);
            } else {
                if (viewModal.classList.contains('active')) {
                    closeViewModal();
                } else if (isDoubleTap) {
                    openCreateModal(null);
                }
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        renderGraph();

        function loop() {
            requestAnimationFrame(loop);
            if (camFlight.active) {
                controls.target.lerp(camFlight.target, 0.08);
                camera.position.lerp(camFlight.camPos, 0.06);
                if (camera.position.distanceTo(camFlight.camPos) < 1.2) camFlight.active = false;
            }
            controls.update();
            physics();

            nebulae.forEach(neb => {
                if (neb.group.length > 0) {
                    let cx = 0, cy = 0, cz = 0;
                    neb.group.forEach(o => { cx += o.pos.x; cy += o.pos.y; cz += o.pos.z; });
                    const cnt = neb.group.length;
                    neb.sprite.position.set(cx / cnt, cy / cnt, cz / cnt);
                }
            });

            links.forEach(l => {
                const posArr = l.line.geometry.attributes.position.array;
                posArr[0] = l.src.pos.x; posArr[1] = l.src.pos.y; posArr[2] = l.src.pos.z;
                posArr[3] = l.tgt.pos.x; posArr[4] = l.tgt.pos.y; posArr[5] = l.tgt.pos.z;
                l.line.geometry.attributes.position.needsUpdate = true;
            });

            pulses.forEach(p => {
                p.phase = (p.phase + 0.0045) % 1;
                p.sprite.position.lerpVectors(p.src.pos, p.tgt.pos, p.phase);
            });

            rings.forEach(r => {
                r.mesh.position.copy(r.targetPos);
                r.mesh.rotation.x += r.speedX;
                r.mesh.rotation.y += r.speedY;
            });

            labels.forEach(l => {
                l.s.position.copy(l.p);
                l.s.position.y += (l.off * 0.22) + 4;
                const d = camera.position.distanceTo(l.s.position);
                const distOp = THREE.MathUtils.clamp(1 - ((d - 280) / 140), 0, 1);
                l.s.material.opacity = distOp * (l.obj ? l.obj.targetOp : 1);
            });

            const t = Date.now() * 0.002;
            starsA.rotation.y += 0.00015;
            starsB.rotation.y += 0.00012;
            starsC.rotation.y += 0.00018;

            starsA.material.opacity = 0.55 + Math.sin(t * 1.8) * 0.4;
            starsB.material.opacity = 0.5 + Math.cos(t * 2.4 + 1.2) * 0.35;
            starsC.material.opacity = 0.6 + Math.sin(t * 1.1 + 3.0) * 0.35;
            updateMeteor();
            renderer.render(scene, camera);
        }
        loop();
    </script>
</body>
</html>
